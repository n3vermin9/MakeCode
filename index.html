<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Поиск товара · Штрихкоды EAN-13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">EAN13</div>
    <div class="brand-text">
      <h1>Поиск товара и генератор штрихкодов</h1>
      <p>склад · торговый зал · S555</p>
    </div>
  </div>
  <div class="db-count">товаров в базе<br><b id="db-count">0</b></div>
</header>

<main class="layout">

  <section class="left-col">
    <div class="search-wrap">
      <div class="search-box">
        <input id="search-input" type="text" placeholder="Код товара, штрихкод или название…" autocomplete="off" spellcheck="false">
        <button id="clear-btn" class="clear-btn" type="button" aria-label="Очистить">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <button id="submit-search-btn" class="submit-search-btn" type="button" aria-label="Найти">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
      </div>
      <div id="suggestions" class="suggestions"></div>
    </div>

    <div>
      <p class="section-label">История просмотров</p>
      <div id="history-list" class="history-list"></div>
    </div>
  </section>

  <section class="right-col">

    <div id="empty-state" class="empty-state visible">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"></rect><path d="M7 3v18M11 3v18M3 7h4M3 11h4M3 15h4M17 3v18M21 8h-4M21 12h-4M21 16h-4"></path></svg>
      <p class="empty-title">Начните поиск</p>
      <p class="empty-sub">Введите код товара, штрихкод или часть названия — карточка появится здесь.</p>
    </div>

    <div id="result-card" class="result-card">

      <div class="card-top">
        <div>
          <p class="card-eyebrow" id="res-group">—</p>
          <h2 class="card-name" id="res-name">—</h2>
          <div class="card-meta">
            <span>Бренд: <b id="res-brand">—</b></span>
          </div>
        </div>
        <div class="card-code-box">
          <div class="lbl">Код товара</div>
          <div class="val" id="res-code">—</div>
        </div>
      </div>

      <div class="locations-panel">
        <div class="panel-head">Расположение на складе</div>
        <div id="res-locations"></div>
      </div>

      <div class="action-row">
        <button id="show-barcode-btn" class="action-btn primary" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1"></rect><path d="M7 3v18M11 3v18M17 3v18"></path></svg>
          Показать штрихкод
        </button>
        <button id="copy-btn" class="action-btn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="1"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg>
          Скопировать ШК
        </button>
        <button id="print-btn" class="action-btn ghost" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          Распечатать этикетку
        </button>
      </div>

    </div>

  </section>

</main>

<div id="barcode-modal" class="modal-overlay" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-product-name">
    <button id="modal-close-btn" class="modal-close" type="button" aria-label="Закрыть">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="modal-head">
      <p class="card-eyebrow" id="modal-group">—</p>
      <h3 id="modal-product-name" class="modal-product-name">—</h3>
      <div class="modal-code-row">
        <span>Код: <b id="modal-code">—</b></span>
        <span>Бренд: <b id="modal-brand">—</b></span>
      </div>
    </div>
    <div class="barcode-panel">
      <div id="scan-beam" class="scan-beam"></div>
      <svg id="barcode-svg"></svg>
      <div id="barcode-format-note" class="barcode-format-note"></div>
      <div style="font-family: var(--mono); font-size: 12px; color:#6b6553; margin-top: 4px;">ШК: <span id="res-barcode-value">—</span></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
